version: 1
name: action-security-permissions-issues
model: light
tools: [github.read.issue]
limits:
  timeout: 1m
  max_iterations: 2
  max_model_calls: 2
  max_tool_calls: 2
  max_concurrency: 1
  max_parallel_calls: 1
  max_artifact_bytes: 0
inputs:
  event-name:
    schema: {type: string, max_length: 64}
steps:
  - id: report
    needs: []
    instruction: Return a completed payload.
    tools: [github.read.issue]
    workspaces: []
    input:
      type: object
      properties:
        event_name: {type: string, max_length: 64}
      required: [event_name]
    with:
      event_name: {input: event-name}
    output:
      type: object
      properties:
        outcome: {type: string, enum: [completed]}
      required: [outcome]
result: {step: report}

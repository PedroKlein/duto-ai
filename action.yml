name: duto-ai

description: Run one admitted duto-ai workflow through the official composite adapter.

inputs:
  workflow:
    description: Relative workflow file under GITHUB_WORKSPACE; absolute paths, traversal, and symlinks reject.
    required: true
  config:
    description: Relative trusted config file under GITHUB_WORKSPACE; defaults to duto.yaml.
    required: false
    default: duto.yaml
  version:
    description: Exact duto-ai release tag in vMAJOR.MINOR.PATCH form.
    required: true
  evidence-retention-days:
    description: Retention days for the uploaded redacted Action evidence bundle.
    required: false
    default: "7"

outputs:
  status:
    description: Typed runtime status (empty when no typed result was emitted).
    value: ${{ steps.project.outputs.status }}
  outcome:
    description: Typed runtime outcome (empty when unavailable).
    value: ${{ steps.project.outputs.outcome }}
  run-id:
    description: Typed runtime run identifier (empty when unavailable).
    value: ${{ steps.project.outputs['run-id'] }}
  result-path:
    description: Runner-local path to the typed result file when available.
    value: ${{ steps.project.outputs['result-path'] }}
  evidence-path:
    description: Runner-local path to the redacted Action evidence bundle.
    value: ${{ steps.project.outputs['evidence-path'] }}
  failed-step:
    description: Failed-step identifier from the typed result, when available.
    value: ${{ steps.project.outputs['failed-step'] }}
  clarification-required:
    description: Boolean signal for awaiting_input outcomes; empty when unavailable.
    value: ${{ steps.project.outputs['clarification-required'] }}

runs:
  using: composite
  steps:
    - name: Install duto-ai
      id: install
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_TEMP: ${{ runner.temp }}
        DUTO_ACTION_REPOSITORY: ${{ github.action_repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        DUTO_ACTION_PATH: ${{ github.action_path }}
      run: bash "${DUTO_ACTION_PATH}/action/install.sh"

    - name: Prepare trusted workflow inputs
      id: prepare
      shell: bash
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_ACTOR_ID: ${{ github.actor_id }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_CONFIG: ${{ inputs.config }}
        DUTO_ACTION_PATH: ${{ github.action_path }}
      run: bash "${DUTO_ACTION_PATH}/action/prepare.sh"

    - name: Run duto-ai
      id: run
      shell: bash
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_CONFIG: ${{ inputs.config }}
        DUTO_ACTION_PATH: ${{ github.action_path }}
        DUTO_ACTION_RESULT_FILE: ${{ runner.temp }}/duto-action-result.json
        DUTO_ACTION_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/duto-runtime-evidence
      run: bash "${DUTO_ACTION_PATH}/action/run.sh" "${DUTO_ACTION_BIN}"

    - name: Project Action outputs and redacted evidence
      id: project
      if: always()
      shell: bash
      env:
        INPUT_EVIDENCE_RETENTION_DAYS: ${{ inputs.evidence-retention-days }}
        DUTO_ACTION_PATH: ${{ github.action_path }}
        DUTO_ACTION_RESULT_FILE: ${{ runner.temp }}/duto-action-result.json
        DUTO_ACTION_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/duto-runtime-evidence
        DUTO_ACTION_ACTION_EVIDENCE_DIR: ${{ runner.temp }}/duto-action-evidence
        DUTO_ACTION_WORKFLOW_DIGEST_PREFIX: ${{ github.workflow_sha }}
      run: bash "${DUTO_ACTION_PATH}/action/project.sh"

    - name: Upload redacted Action evidence
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ env.DUTO_ACTION_ARTIFACT_NAME }}
        path: ${{ env.DUTO_ACTION_ACTION_EVIDENCE_DIR }}
        retention-days: ${{ inputs.evidence-retention-days }}
        if-no-files-found: error

    - name: Restore duto-ai exit
      id: final-exit
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        code="${DUTO_ACTION_RUN_EXIT_CODE:-1}"
        if [[ ! "$code" =~ ^[0-9]+$ ]]; then
          echo "error: DUTO_ACTION_RUN_EXIT_CODE is invalid" >&2
          exit 1
        fi
        exit "$code"

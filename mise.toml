[env]
_.file = ".env"

[tools]
go = "1.26.5"
golangci-lint = "2.12.2"

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fix]
description = "Auto-fix lint issues (wsl whitespace, gofmt, etc.)"
run = "golangci-lint run --fix ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run all checks (build + vet + lint + test)"
depends = ["build", "vet", "lint", "test"]

[tasks.integration]
description = "Run integration tests with mock LLM"
run = "go test -tags=integration ./... -v -timeout=3m"

[tasks.scenarios]
description = "Run the exact M1 scenario and forbidden-marker gates"
run = "go test -race -tags=integration ./internal/runtime -run '^TestScenario' -count=1"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.coverage]
description = "Run tests with coverage report"
run = """
go test -race -coverprofile=coverage.out ./...
go tool cover -html=coverage.out -o coverage.html
echo "Coverage report: coverage.html"
"""
